<!-- Projects Section (cards rendered by js/project/project.retrieve.js) -->
<section id="projects" class="section">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-14">
        <div class="space-y-6">
            <p class="eyebrow reveal">Selected work</p>
            <h2 class="section-title reveal" style="--d:.08s">Projects I've <span class="text-gradient">engineered.</span></h2>
        </div>
        <p class="section-lead reveal md:max-w-sm" style="--d:.16s">
            Real systems with authentication, payments, caching and tests. Click any cover to browse screenshots.
        </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="projects-grid">
        <!-- Loading skeletons -->
        <div class="glass p-0 overflow-hidden" aria-hidden="true">
            <div class="skeleton aspect-video !rounded-none"></div>
            <div class="p-7 space-y-3"><div class="skeleton h-6 w-2/3"></div><div class="skeleton h-4 w-full"></div><div class="skeleton h-4 w-5/6"></div></div>
        </div>
        <div class="glass p-0 overflow-hidden" aria-hidden="true">
            <div class="skeleton aspect-video !rounded-none"></div>
            <div class="p-7 space-y-3"><div class="skeleton h-6 w-1/2"></div><div class="skeleton h-4 w-full"></div><div class="skeleton h-4 w-4/6"></div></div>
        </div>
    </div>

    <div class="mt-12 flex flex-wrap justify-center gap-3 reveal" id="projects-actions">
        <a class="btn btn-ghost" href="https://github.com/MonemAdawy" target="_blank" rel="noopener">
            See more on GitHub
            <span class="material-symbols-outlined">north_east</span>
        </a>
    </div>
</section>

<!-- Image gallery modal -->
<div id="image-modal" class="fixed inset-0 hidden items-center justify-center z-[350] p-4" onclick="if(event.target === this) closeModal()">
    <div class="relative w-full max-w-5xl">
        <div class="flex items-center justify-between mb-4">
            <span id="image-counter" class="mono-label text-xs text-on-surface-variant"></span>
            <button onclick="closeModal()" class="icon-btn" aria-label="Close gallery">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="relative flex items-center justify-center">
            <img id="modal-image" class="w-full max-h-[75vh] object-contain" alt="Project screenshot"/>

            <button onclick="prevImage()" class="icon-btn absolute left-2 sm:-left-16 top-1/2 -translate-y-1/2 !bg-black/60" aria-label="Previous image">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <button onclick="nextImage()" class="icon-btn absolute right-2 sm:-right-16 top-1/2 -translate-y-1/2 !bg-black/60" aria-label="Next image">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <div id="modal-dots" class="flex justify-center mt-5 gap-2"></div>
    </div>
</div>
