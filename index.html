<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monem Adawy — Backend Engineer</title>
<meta name="description" content="Monem Adawy — Backend Engineer specializing in Node.js & NestJS. Secure APIs, clean architecture, and systems that scale."/>
<meta name="theme-color" content="#07090c"/>
<meta property="og:title" content="Monem Adawy — Backend Engineer"/>
<meta property="og:description" content="Secure APIs, clean architecture, and backend systems that scale."/>
<meta property="og:image" content="assets/images/myPhoto22.jpeg"/>

<!-- Tailwind CSS CDN (يجب أن يكون أولاً) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Tailwind Config -->
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "surface": "#07090c",
                    "on-surface": "#f4f6fa",
                    "on-surface-variant": "#9ba1ab",
                    "primary": "#3fff8b",
                    "secondary": "#74fbbb",
                    "tertiary": "#7ae6ff",
                    "accent": "#a78bfa",
                    "primary-dim": "#24f07e",
                    "secondary-dim": "#65ecae",
                    "tertiary-dim": "#00cdec",
                    "surface-container": "#12151a",
                    "surface-container-low": "#0d1014",
                    "surface-container-high": "#181c22",
                    "surface-container-highest": "#20252c",
                    "surface-container-lowest": "#000000",
                    "outline": "#6b717b",
                    "outline-variant": "#2a2f37",
                    "error": "#ff716c",
                    "error-dim": "#d7383b",
                    "on-primary": "#00351a"
                },
                fontFamily: {
                    headline: ["Space Grotesk", "sans-serif"],
                    body: ["Inter", "sans-serif"],
                    mono: ["JetBrains Mono", "monospace"]
                }
            }
        }
    }
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Design system -->
<link rel="stylesheet" href="css/main.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">

<!-- Preloader -->
<div id="preloader" aria-hidden="true">
    <div class="preloader-inner">
        <div class="preloader-mark">MA</div>
        <div class="preloader-bar"><span></span></div>
        <div class="preloader-text mono-label">booting portfolio<span class="blink">_</span></div>
    </div>
</div>

<!-- Ambient background -->
<div class="bg-layers" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="bg-noise"></div>
</div>
<div id="cursor-glow" aria-hidden="true"></div>
<div id="scroll-progress" aria-hidden="true"></div>

<!-- Main App Container -->
<div id="app">
    <div id="slot-navbar"></div>
    <main>
        <div id="slot-hero"></div>
        <div id="slot-about"></div>
        <div id="slot-career"></div>
        <div id="slot-certifications"></div>
        <div id="slot-projects"></div>
        <div id="slot-skills"></div>
        <div id="slot-services"></div>
        <div id="slot-contact"></div>
    </main>
    <div id="slot-footer"></div>
</div>

<!-- Interactive terminal (open with the terminal icon or Ctrl+K) -->
<div id="terminal-modal" class="terminal-modal" role="dialog" aria-modal="true" aria-label="Interactive terminal">
    <div class="terminal-window">
        <div class="terminal-bar">
            <div class="flex gap-2">
                <button class="dot dot-red" data-terminal-close aria-label="Close terminal"></button>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <span class="mono-label text-xs text-on-surface-variant">monem@portfolio: ~</span>
            <span class="mono-label text-[10px] text-outline hidden sm:inline">ESC to close</span>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div id="terminal-output"></div>
            <form id="terminal-form" class="terminal-line-input">
                <span class="text-primary">➜</span>
                <span class="text-tertiary">~</span>
                <input id="terminal-input" autocomplete="off" spellcheck="false" aria-label="Terminal input"/>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/main.js"></script>

</body>
</html>
