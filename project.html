<!-- Hold the first frame until the page has rendered from cache, so the
     cover image can morph in from the card that was clicked -->
<link rel="expect" href="#pd-ready" blocking="render"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/css/main.css"/>
<link rel="stylesheet" href="/css/project.css"/>

<body class="pd-page">

<!-- Ambient background (same as the home page) -->
<div class="bg-layers" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="bg-noise"></div>
</div>
<div id="cursor-glow" aria-hidden="true"></div>
<div id="scroll-progress" aria-hidden="true"></div>

<header class="pd-topbar" id="pd-topbar">
    <div class="pd-topbar-inner">
        <a href="/#projects" class="pd-back" id="pd-back">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>All projects</span>
        </a>
        <a href="/" class="nav-logo pd-logo" aria-label="Monem Adawy — home">
            <span class="nav-logo-mark">MA</span>
        </a>
        <div class="pd-topbar-end">
            <span class="mono-label pd-counter" id="pd-counter"></span>
            <a class="icon-btn" id="pd-prev-mini" href="#" aria-label="Previous project" hidden>
                <span class="material-symbols-outlined">chevron_left</span>
            </a>
            <a class="icon-btn" id="pd-next-mini" href="#" aria-label="Next project" hidden>
                <span class="material-symbols-outlined">chevron_right</span>
            </a>
        </div>
    </div>
</header>

<main id="pd-root" class="pd-root" aria-live="polite">
    <!-- Filled by js/project/project.page.js -->
</main>

<footer class="pd-footer">
    <span>© <span id="pd-year">2026</span> Monem Adawy</span>
    <span class="mono-label">Use <kbd>←</kbd> <kbd>→</kbd> to switch projects</span>
</footer>

<!-- Fullscreen screenshot viewer -->
<div class="pd-lightbox" id="pd-lightbox" role="dialog" aria-modal="true" aria-label="Screenshot viewer" hidden>
    <div class="pd-lightbox-bar">
        <span class="mono-label" id="pd-lb-counter"></span>
        <button type="button" class="icon-btn" data-lb="close" aria-label="Close viewer">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    <div class="pd-lightbox-stage">
        <button type="button" class="icon-btn pd-lb-nav pd-lb-prev" data-lb="prev" aria-label="Previous screenshot">
            <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <img id="pd-lb-image" alt=""/>
        <button type="button" class="icon-btn pd-lb-nav pd-lb-next" data-lb="next" aria-label="Next screenshot">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
    </div>
    <div class="pd-lightbox-thumbs" id="pd-lb-thumbs"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/project/project.model.js"></script>
<script src="/js/project/project.page.js"></script>
<div id="pd-ready" hidden></div>
</body>
</html>
